<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Void</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card fade-up">
    <div class="login-logo">V<span>.</span>OID</div>
    <div class="login-sub">// admin access · moonlight unlocks here</div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="input" id="username" type="text" placeholder="Username" autocomplete="username" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="input" id="password" type="password" placeholder="Password" autocomplete="current-password" />
    </div>
    <div class="form-error" id="login-error" style="display:none"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()" id="login-btn">
      Login →
    </button>
    <div style="margin-top:16px;text-align:center">
      <a href="/" style="font-size:12px;color:var(--text3);font-family:var(--font-mono)">← back to void</a>
    </div>
  </div>
</div>

<script>
  // If already logged in redirect to moonlight
  fetch('/api/auth-status').then(r=>r.json()).then(d=>{
    if (d.admin) window.location.href = '/moonlight.html';
  });

  async function doLogin() {
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    btn.textContent = 'Logging in...'; btn.disabled = true; err.style.display = 'none';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/moonlight.html';
      } else {
        err.textContent = data.message || 'Invalid credentials';
        err.style.display = 'block';
        btn.textContent = 'Login →'; btn.disabled = false;
      }
    } catch {
      err.textContent = 'Connection error'; err.style.display = 'block';
      btn.textContent = 'Login →'; btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
